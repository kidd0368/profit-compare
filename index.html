const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryPw(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(){
  const pw = document.getElementById("pw").value;
  try{
    const html = await tryPw(pw);
    try{ sessionStorage.setItem("pc_pw", pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById("err").textContent = "密碼錯誤";
  }
}
document.getElementById("pw").addEventListener("keydown", e => { if(e.key === "Enter") unlock(); });
(async()=>{ try{ const s = sessionStorage.getItem("pc_pw"); if(s){ const h = await tryPw(s);
  document.open(); document.write(h); document.close(); } }catch(e){} })();
</script>
